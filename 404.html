<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Yuste Ruíz Mobiliario</title>
<link rel="icon" href="img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="robots" content="noindex">
<style>
:root{
  --nogal:#5a4230;
  --paper:#f2ede3;
  --brass:#a87b2d;
  --brass-light:#c99a45;
  --ink:#2b241d;
  --muted:#7a6f60;
  --display:'Libre Caslon Text',Georgia,serif;
  --body:'Karla',system-ui,sans-serif;
}
@font-face{font-family:'Karla';font-style:normal;font-weight:400 700;font-display:swap;src:url('fonts/karla-variable.woff2') format('woff2')}
@font-face{font-family:'Libre Caslon Text';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/libre-caslon-text-700.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--nogal);color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.6}
.wrap{max-width:460px;padding:24px}
.num{font-family:var(--display);font-weight:700;font-size:clamp(4rem,14vw,7rem);color:var(--brass-light);line-height:1}
h1{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:.3em 0 .6em}
p{color:#d9d2c4;margin-bottom:1.6em}
a{display:inline-block;text-decoration:none;font-weight:700;font-size:.95rem;padding:14px 28px;border-radius:99px;background:var(--brass);color:#fff;transition:background .15s ease}
a:hover{background:var(--brass-light)}
</style>
</head>
<body>
<div class="wrap">
  <div class="num">404</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté roto o la página se haya movido.</p>
  <a href="/">Volver al inicio</a>
</div>
</body>
</html>
